name: Release

# Publishes downloadable builds for macOS, Linux, and Windows to GitHub Releases.
#
# To release: set the version in Cargo.toml, update CHANGELOG.md, commit, then push a matching
# tag, e.g. `git tag v0.1.0 && git push origin v0.1.0`. A tag with a hyphen (v0.2.0-beta.1)
# is published as a pre-release.
#
# To try the builds without publishing, run this workflow manually from the Actions tab; the
# archives are attached to the run as artifacts.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS universal
            os: macos-latest
            targets: aarch64-apple-darwin,x86_64-apple-darwin
            args: --macos-universal
          # Ubuntu 22.04 links against an older glibc, so the binaries also run on older distros.
          - name: Linux x86_64
            os: ubuntu-22.04
            targets: x86_64-unknown-linux-gnu
            args: --target x86_64-unknown-linux-gnu
          - name: Linux arm64
            os: ubuntu-22.04-arm
            targets: aarch64-unknown-linux-gnu
            args: --target aarch64-unknown-linux-gnu
          - name: Windows x86_64
            os: windows-latest
            targets: x86_64-pc-windows-msvc
            args: --target x86_64-pc-windows-msvc
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: >-
          sudo apt-get update && sudo apt-get install -y
          build-essential pkg-config libxkbcommon-dev libwayland-dev libx11-dev
          libxcursor-dev libxrandr-dev libxi-dev libgl1-mesa-dev

      - name: Install Rust
        shell: bash
        run: |
          rustup toolchain install stable --profile minimal --target ${{ matrix.targets }}
          rustup default stable

      - name: Check the tag matches Cargo.toml
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: echo "EXPECT=--expect-version ${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"

      # Compiles with no secrets in the environment: dependency build scripts run here.
      - name: Build and package
        shell: bash
        run: python scripts/package.py ${{ matrix.args }} $EXPECT

      # macOS only, and only once the signing secrets exist (see DEVELOPMENT.md). Re-packages
      # the binaries built above without compiling anything, so the secrets are only ever
      # visible to codesign and Apple's notary tool.
      - name: Sign and notarize (macOS)
        if: runner.os == 'macOS'
        shell: bash
        env:
          MACOS_CERTIFICATE_P12: ${{ secrets.MACOS_CERTIFICATE_P12 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          MACOS_SIGNING_IDENTITY: ${{ secrets.MACOS_SIGNING_IDENTITY }}
          NOTARY_KEY_P8: ${{ secrets.NOTARY_KEY_P8 }}
          NOTARY_KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
          NOTARY_ISSUER_ID: ${{ secrets.NOTARY_ISSUER_ID }}
        run: |
          if [[ -z "$MACOS_CERTIFICATE_P12" ]]; then
            echo "No signing secrets; keeping the ad-hoc signed build."
            exit 0
          fi
          keychain="$RUNNER_TEMP/signing.keychain-db"
          keychain_password="$(openssl rand -base64 32)"
          printf '%s' "$MACOS_CERTIFICATE_P12" | base64 --decode > "$RUNNER_TEMP/certificate.p12"
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 3600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          security import "$RUNNER_TEMP/certificate.p12" -k "$keychain" -f pkcs12 \
            -P "$MACOS_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -k "$keychain_password" "$keychain" > /dev/null
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          rm "$RUNNER_TEMP/certificate.p12"

          if [[ -n "$NOTARY_KEY_P8" ]]; then
            printf '%s' "$NOTARY_KEY_P8" | base64 --decode > "$RUNNER_TEMP/notary_key.p8"
            export NOTARY_KEY_PATH="$RUNNER_TEMP/notary_key.p8"
          else
            unset NOTARY_KEY_ID NOTARY_ISSUER_ID
          fi
          rm -f dist/*
          python scripts/package.py ${{ matrix.args }} --skip-build $EXPECT
          rm -f "$RUNNER_TEMP/notary_key.p8"
          security delete-keychain "$keychain"

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.name }}
          path: dist/*
          if-no-files-found: error

  publish:
    name: Publish release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: Combine checksums
        working-directory: dist
        run: |
          cat *.sha256 > SHA256SUMS
          rm *.sha256
          sha256sum -c SHA256SUMS
          ls -l

      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          prerelease=""
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then prerelease="--prerelease"; fi
          gh release create "$GITHUB_REF_NAME" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "$GITHUB_REF_NAME" \
            --verify-tag \
            --generate-notes \
            $prerelease
