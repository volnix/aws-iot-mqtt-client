[package]
name = "aws-iot-mqtt-client"
version = "0.1.0"
edition = "2021"
rust-version = "1.95"
description = "Cross-platform desktop MQTT 3.1.1/5 client for AWS IoT Core"
authors = ["Amazon Web Services"]
license = "Apache-2.0"
repository = "https://github.com/aws-solutions/aws-iot-mqtt-client"
readme = "README.md"
keywords = ["aws", "iot", "mqtt", "desktop", "egui"]
categories = ["gui", "network-programming"]
publish = false

[[bin]]
name = "aws-iot-mqtt-client"
path = "src/main.rs"

[dependencies]
eframe = { version = "0.37", default-features = false, features = ["default_fonts", "glow", "wayland", "x11", "persistence", "accesskit"] }
egui = { version = "0.37", features = ["monochrome_emoji_fonts"] }
aws-config = { version = "1.13", features = ["behavior-version-latest"] }
aws-sdk-iot = "1.135"
aws-sdk-sts = "1.124"
aws-sdk-iotdataplane = "1.121"
rumqttc = { version = "0.25", default-features = false, features = ["use-rustls"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync"] }
rustls-pemfile = "2.2"
rustls = { version = "0.23", default-features = false, features = ["aws_lc_rs", "std", "tls12"] }
webpki-roots = "1"
sha2 = "0.10"
x509-parser = "0.18"
rfd = { version = "0.15", default-features = false, features = ["xdg-portal", "tokio"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }

[dev-dependencies]
rcgen = { version = "0.14", default-features = false, features = ["aws_lc_rs", "pem"] }
proptest = "1"
tempfile = "3"
